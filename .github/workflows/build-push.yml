name: 'build_push'

on:
  push:
    branches:
    - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 'Build'
    runs-on: davidapps-linux-x64
    steps:
      - name: "Build:checkout"
        uses: actions/checkout@v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: 'Build:dockerimage'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/davidilie/sharex-docker-upload-server:latest
          cache-from: type=gha,scope=sharex-docker-upload-server
          cache-to: type=gha,mode=max,scope=sharex-docker-upload-server
